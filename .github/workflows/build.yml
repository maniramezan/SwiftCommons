name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: "6.2"

      - name: Cache SwiftPM
        uses: actions/cache@v6.1.0
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift Format Lint
        run: |
          if command -v swift-format >/dev/null 2>&1; then
            SWIFT_FORMAT="$(command -v swift-format)"
          else
            SWIFT_FORMAT="$(xcrun --find swift-format)"
          fi

          "$SWIFT_FORMAT" lint \
            --configuration .swift-format \
            --strict \
            --recursive \
            Sources \
            Tests

      - name: Build
        run: swift build

      - name: Test
        run: swift test --enable-code-coverage

      - name: Coverage report and gate
        env:
          MIN_COVERAGE: "90"
        run: |
          bin_path="$(swift build --show-bin-path)"
          profdata="${bin_path}/codecov/default.profdata"
          xctest="$(find "${bin_path}" -maxdepth 1 -name '*.xctest' | head -n 1)"
          binary="${xctest}/Contents/MacOS/$(basename "${xctest}" .xctest)"

          report="$(xcrun llvm-cov report "${binary}" \
            -instr-profile "${profdata}" \
            -ignore-filename-regex='.build|Tests')"
          echo "${report}"

          coverage="$(xcrun llvm-cov export "${binary}" \
            -instr-profile "${profdata}" \
            -ignore-filename-regex='.build|Tests' \
            -summary-only \
            | python3 -c 'import json,sys; print("%.2f" % json.load(sys.stdin)["data"][0]["totals"]["lines"]["percent"])')"

          {
            echo "## Code coverage: ${coverage}% (minimum ${MIN_COVERAGE}%)"
            echo '```'
            echo "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if awk -v c="${coverage}" -v m="${MIN_COVERAGE}" 'BEGIN { exit !(c + 0 >= m + 0) }'; then
            echo "Line coverage ${coverage}% meets the ${MIN_COVERAGE}% minimum."
          else
            echo "::error::Line coverage ${coverage}% is below the required ${MIN_COVERAGE}% minimum."
            exit 1
          fi

      - name: Build Symbol Graphs
        run: |
          swift build \
            --target SwiftCommons \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir \
            -Xswiftc /tmp/symbolgraphs

      - name: Generate DocC
        run: |
          xcrun docc convert \
            Sources/SwiftCommons/SwiftCommons.docc \
            --additional-symbol-graph-dir /tmp/symbolgraphs \
            --fallback-display-name SwiftCommons \
            --fallback-bundle-identifier com.maniramezan.swiftcommons \
            --warnings-as-errors \
            --analyze \
            --output-path /tmp/docc
