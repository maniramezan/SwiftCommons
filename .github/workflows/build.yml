name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build Symbol Graphs
        run: |
          swift build \
            --target SwiftCommons \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir \
            -Xswiftc /tmp/symbolgraphs

      - name: Generate DocC
        run: |
          xcrun docc convert Sources/SwiftCommons/SwiftCommons.docc \
            --additional-symbol-graph-dir /tmp/symbolgraphs \
            --warnings-as-errors \
            --analyze \
            --output-path /tmp/docc
