name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift Format Lint
        run: |
          if command -v swift-format >/dev/null 2>&1; then
            SWIFT_FORMAT="$(command -v swift-format)"
          else
            SWIFT_FORMAT="$(xcrun --find swift-format)"
          fi

          "$SWIFT_FORMAT" lint \
            --configuration .swift-format \
            --strict \
            --recursive \
            Sources \
            Tests

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build Symbol Graphs
        run: |
          swift build \
            --target SwiftCommons \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir \
            -Xswiftc /tmp/symbolgraphs

      - name: Generate DocC
        run: |
          xcrun docc convert \
            --additional-symbol-graph-dir /tmp/symbolgraphs \
            --fallback-display-name SwiftCommons \
            --fallback-bundle-identifier com.maniramezan.swiftcommons \
            --warnings-as-errors \
            --analyze \
            --output-path /tmp/docc
