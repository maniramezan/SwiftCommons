name: Release

# Tags the repository and publishes a GitHub Release (with auto-generated notes)
# whenever the "CI" workflow succeeds on main. Versions are derived from the
# Conventional Commit prefix of each merged PR's TITLE (not the squash commit
# message) since the previous tag; no CHANGELOG.md is kept.
#
# We always squash-merge, but GitHub only substitutes the PR title into the
# squash commit message for multi-commit PRs — a single-commit PR keeps that
# commit's own message verbatim, which can drift from the (CI-enforced)
# Conventional Commit PR title. So for every commit since the last tag we look
# up its "(#NNN)" PR number and read that PR's title via the API, falling back
# to the raw commit subject only if no PR number is found (e.g. a direct push).
# Tags are bare SemVer with NO "v" prefix (e.g. 0.3.0, 0.4.0).
#
# Bump rules (0.x, pre-1.0):
#   feat: / <type>! / BREAKING CHANGE  -> minor
#   fix: / perf:                       -> patch
#   anything else (chore/docs/...)    -> no release
# After a manual bump to 1.0.0, standard SemVer applies (breaking -> major).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_version:
        description: "Force an exact version, e.g. 0.4.0 (bypasses commit analysis)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    name: Tag and publish GitHub Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          FORCE_VERSION: ${{ github.event.inputs.force_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"

          if [ -n "${FORCE_VERSION:-}" ]; then
            next="${FORCE_VERSION#v}"
            echo "Forcing version $next"
            echo "tag=$next" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$latest_tag" ]; then
            echo "No existing tags; bootstrapping 0.1.0"
            echo "tag=0.1.0" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Latest tag: $latest_tag"
          version="$latest_tag"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"

          range="${latest_tag}..HEAD"
          if [ -z "$(git log "$range" --format='%H')" ]; then
            echo "No commits since $latest_tag; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For each commit since the last tag, prefer its merged PR's title
          # (what the Conventional Commit PR-title check in ci.yml enforces)
          # over the squash commit's own subject, which only matches the PR
          # title for multi-commit PRs. Falls back to the commit subject/body
          # when no PR number is found.
          breaking=false; feat=false; fix=false
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            subject="$(git log -1 --format='%s' "$sha")"
            body="$(git log -1 --format='%b' "$sha")"
            pr_number="$(printf '%s' "$subject" | grep -oE '\(#[0-9]+\)$' | grep -oE '[0-9]+' || true)"
            title=""
            if [ -n "$pr_number" ]; then
              title="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json title -q .title 2>/dev/null || true)"
            fi
            if [ -z "$title" ]; then
              title="$subject"
            fi
            if printf '%s' "$title" | grep -Eq '^[a-zA-Z]+(\([^)]+\))?!:'; then breaking=true; fi
            if printf '%s\n%s' "$title" "$body" | grep -Eq 'BREAKING[ -]CHANGE'; then breaking=true; fi
            if printf '%s' "$title" | grep -Eq '^feat(\([^)]+\))?!?:'; then feat=true; fi
            if printf '%s' "$title" | grep -Eq '^(fix|perf)(\([^)]+\))?!?:'; then fix=true; fi
          done <<< "$(git log "$range" --format='%H')"

          bump="none"
          if [ "$major" -eq 0 ]; then
            if [ "$breaking" = true ] || [ "$feat" = true ]; then bump="minor"
            elif [ "$fix" = true ]; then bump="patch"
            fi
          else
            if [ "$breaking" = true ]; then bump="major"
            elif [ "$feat" = true ]; then bump="minor"
            elif [ "$fix" = true ]; then bump="patch"
            fi
          fi

          if [ "$bump" = "none" ]; then
            echo "No releasable commits (feat/fix/perf/breaking) since $latest_tag."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          next="${major}.${minor}.${patch}"
          echo "Bump: $bump -> $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"

          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

          gh release create "$tag" --title "$tag" --generate-notes
