name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  docs-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Build Symbol Graphs
        run: |
          swift build \
            --target SwiftCommons \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir \
            -Xswiftc /tmp/symbolgraphs

      - name: Generate DocC (Static)
        run: |
          xcrun docc convert Sources/SwiftCommons/SwiftCommons.docc \
            --additional-symbol-graph-dir /tmp/symbolgraphs \
            --warnings-as-errors \
            --analyze \
            --transform-for-static-hosting \
            --hosting-base-path /SwiftCommons \
            --output-path /tmp/docc

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/docc

  docs-deploy:
    needs: docs-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
