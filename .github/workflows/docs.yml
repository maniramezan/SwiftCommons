name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  docs-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Generate DocC (Static)
        run: |
          bash scripts/docs/clean.sh
          archive_path="$(bash scripts/docs/generate.sh "${{ github.event.repository.name }}")"
          bash scripts/docs/prepare-site.sh "$archive_path"
          bash scripts/docs/redirect-root.sh "SwiftCommons"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/docc-site

  docs-deploy:
    needs: docs-build
    runs-on: ubuntu-latest
    environment:
      name: github_pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
